<!doctype html><html lang="zh"><meta charset="utf-8"><title>原核物空间候选图 — 真三维查看</title>
<style>body{margin:0;background:#f7f8fa;color:#223;font:15px sans-serif}header{padding:12px}canvas{display:block;background:white;width:100vw;height:calc(100vh - 105px)}label{margin-right:15px}small{display:block;padding-top:7px}</style>
<header>原 Gaussian 中心的 kernel-space candidate graph　<select id="scene"><option>lego</option><option>chair</option></select>
<label><input type="checkbox" id="A">A 近邻</label><label><input type="checkbox" id="B" checked>B PCA/互选</label><label><input type="checkbox" id="PCA">PCA 无向轴</label><label><input type="checkbox" id="nodes" checked>原核中心</label>
<small>拖动旋转，滚轮缩放。原始世界 XYZ / Z-up；点色：r_7 橙、r_33 蓝、两者紫。PCA 是点分布轴，不是表面法线。X-ray，无隐藏线消除；候选图未经真实物理边认证。</small><div id="info"></div></header><canvas id="canvas"></canvas>
<script>const DATA=__DATA__;const cv=document.getElementById('canvas'),ctx=cv.getContext('2d');let yaw=-.95,pitch=.40,zoom=1,drag=null;
const controls=['scene','A','B','PCA','nodes'];for(const id of controls)document.getElementById(id).onchange=draw;
function draw(){const d=DATA[document.getElementById('scene').value];cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;ctx.clearRect(0,0,cv.width,cv.height);const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(const p of d.xyz)for(let j=0;j<3;j++){lo[j]=Math.min(lo[j],p[j]);hi[j]=Math.max(hi[j],p[j]);}const center=lo.map((x,j)=>(x+hi[j])/2),span=Math.max(...lo.map((x,j)=>hi[j]-x)),s=Math.min(cv.width,cv.height)*.65*zoom/span;
function project(p){let [x,y,z]=p.map((v,j)=>v-center[j]);let X=Math.cos(yaw)*x-Math.sin(yaw)*y,Y=Math.sin(yaw)*x+Math.cos(yaw)*y;let Z=Math.cos(pitch)*z-Math.sin(pitch)*Y,depth=Math.cos(pitch)*Y+Math.sin(pitch)*z;let persp=1/(1+depth/(4*span));return [cv.width/2+X*s*persp,cv.height/2-Z*s*persp];}const uv=d.xyz.map(project);
function line(a,b,color,width){ctx.strokeStyle=color;ctx.lineWidth=width*devicePixelRatio;ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();}
for(const arm of ['A','B'])if(document.getElementById(arm).checked)for(const [a,b] of d[arm])line(uv[a],uv[b],arm==='A'?'#1478d2':'#d72d28',1);
if(document.getElementById('PCA').checked)for(let i=0;i<d.xyz.length;i++){const p=d.xyz[i],t=d.tangent[i],len=d.scale[i]*.5;const a=p.map((v,j)=>v-t[j]*len),b=p.map((v,j)=>v+t[j]*len);line(project(a),project(b),`hsl(${220*(1-d.linearity[i])},65%,45%)`,.8);}
if(document.getElementById('nodes').checked)for(let i=0;i<uv.length;i++){ctx.fillStyle=['','#e66e19','#196ee6','#9628aa'][d.source_mask[i]];ctx.fillRect(uv[i][0]-1,uv[i][1]-1,2*devicePixelRatio,2*devicePixelRatio);}
const origin=project(lo),length=span*.18;for(let j=0;j<3;j++){let end=lo.slice();end[j]+=length;const q=project(end);line(origin,q,['red','green','blue'][j],2);ctx.fillStyle=['red','green','blue'][j];ctx.font=`${14*devicePixelRatio}px sans-serif`;ctx.fillText(['X','Y','Z'][j],q[0],q[1]);}
document.getElementById('info').textContent=`${d.xyz.length} 个原核中心；A ${d.A.length} / B ${d.B.length} 条边；固定导出 tube 世界半径 ${d.radius.toPrecision(5)}。此查看器使用中心线展示宽度。`;}
cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};cv.onpointerup=()=>drag=null;cv.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.007;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-drag[1])*.007));drag=[e.clientX,e.clientY];draw()}};cv.onwheel=e=>{e.preventDefault();zoom=Math.max(.2,Math.min(6,zoom*Math.exp(-e.deltaY*.001)));draw()};window.onresize=draw;draw();</script></html>
