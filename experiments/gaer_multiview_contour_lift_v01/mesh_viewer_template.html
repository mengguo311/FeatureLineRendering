<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>固定三维轮廓区域</title>
<style>html,body{margin:0;height:100%;font:15px system-ui;background:#f4f4f4;color:#202020}header{padding:10px 16px;background:white;border-bottom:1px solid #ccc}select,button{font:inherit;margin-right:15px;padding:5px}canvas{display:block;width:100%;height:calc(100% - 108px);touch-action:none}small{display:block;margin-top:5px;overflow-wrap:anywhere}#error{color:#b00020}</style>
<header><select id="asset"></select><button id="reset">重置视角</button>拖动旋转 · 滚轮缩放 · 固定实体三角面 / Z-up<small>仅资产自身深度遮挡；没有原物体表面遮挡，可能看到其后方轮廓。无服务器、无网络、无每视角重拟合。</small><small id="info"></small><small id="error"></small></header><canvas id="view"></canvas>
<script>
'use strict';const assets=__MESH_DATA__;const canvas=document.getElementById('view'),sel=document.getElementById('asset'),gl=canvas.getContext('webgl2',{antialias:true});
if(!gl){document.getElementById('error').textContent='此浏览器未提供 WebGL2。请在支持 WebGL2 的浏览器直接打开本 HTML。';throw Error('WebGL2 unavailable');}
const vs=`#version 300 es
in vec3 aPosition;uniform vec3 uCenter,uRight,uUp,uForward;uniform float uScale,uDistance,uAspect;
void main(){vec3 p=(aPosition-uCenter)/uScale;vec3 q=vec3(dot(p,uRight),dot(p,uUp),dot(p,uForward)+uDistance);float n=.01,f=100.;gl_Position=vec4(q.x*1.8/uAspect,q.y*1.8,(f+n)/(f-n)*q.z-2.*f*n/(f-n),q.z);}`;
const fs=`#version 300 es
precision highp float;out vec4 color;void main(){color=vec4(.06,.18,.28,1.);}`;
function shader(type,text){const s=gl.createShader(type);gl.shaderSource(s,text);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const location=gl.getAttribLocation(program,'aPosition'),vao=gl.createVertexArray();gl.bindVertexArray(vao);const vb=gl.createBuffer(),fb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.enableVertexAttribArray(location);gl.vertexAttribPointer(location,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,fb);
const U={};for(const k of ['Center','Right','Up','Forward','Scale','Distance','Aspect'])U[k]=gl.getUniformLocation(program,'u'+k);
let yaw=-.9,pitch=.45,distance=3.5,current,count=0;function unpack(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer;}
function select(){current=assets[sel.value];gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(unpack(current.vertices)),gl.STATIC_DRAW);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,fb);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint32Array(unpack(current.faces)),gl.STATIC_DRAW);count=current.count;document.getElementById('info').textContent=sel.value+' · '+(count/3)+' 个三角面 · geometry SHA256 '+current.sha256;draw();}
for(const name of Object.keys(assets)){const o=document.createElement('option');o.value=name;o.textContent=name;sel.appendChild(o);}sel.onchange=select;
function draw(){const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.floor(canvas.clientWidth*dpr),h=Math.floor(canvas.clientHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clearColor(1,1,1,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);if(!current)return;
const center=current.min.map((x,i)=>(x+current.max[i])/2),scale=Math.max(...current.max.map((x,i)=>x-current.min[i]))*.5||1;const eye=[Math.cos(pitch)*Math.cos(yaw),Math.cos(pitch)*Math.sin(yaw),Math.sin(pitch)],forward=eye.map(x=>-x),right=[-Math.sin(yaw),Math.cos(yaw),0],up=[-Math.sin(pitch)*Math.cos(yaw),-Math.sin(pitch)*Math.sin(yaw),Math.cos(pitch)];
gl.uniform3fv(U.Center,center);gl.uniform3fv(U.Right,right);gl.uniform3fv(U.Up,up);gl.uniform3fv(U.Forward,forward);gl.uniform1f(U.Scale,scale);gl.uniform1f(U.Distance,distance);gl.uniform1f(U.Aspect,w/h);gl.drawElements(gl.TRIANGLES,count,gl.UNSIGNED_INT,0);}
let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(drag){yaw-=(e.clientX-drag[0])*.008;pitch=Math.max(-1.52,Math.min(1.52,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw();}};canvas.onwheel=e=>{e.preventDefault();distance=Math.max(1.6,Math.min(25,distance*Math.exp(e.deltaY*.001)));draw();};document.getElementById('reset').onclick=()=>{yaw=-.9;pitch=.45;distance=3.5;draw()};window.onresize=draw;select();
</script></html>
